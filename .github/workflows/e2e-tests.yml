name: E2E Tests

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 10, not 9: pnpm-workspace.yaml here holds onlyBuiltDependencies and no
          # `packages:` field, which is a pnpm 10 settings file. pnpm 9 reads it as a
          # workspace definition and fails with "packages field missing or empty".
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          # Assigned first, then echoed. Inlining the substitution into echo throws the
          # inner exit code away, so a failure here used to set STORE_PATH empty, pass,
          # and surface two steps later as actions/cache "Input required and not
          # supplied: path". Under bash -e an assignment does carry the failure.
          STORE_PATH="$(pnpm store path --silent)"
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30